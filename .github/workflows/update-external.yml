name: Update external sources

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 09:00 JST
  workflow_dispatch:
    inputs:
      target:
        description: '更新対象 (手動実行時のみ有効。schedule は常に all)'
        type: choice
        required: false
        default: all
        options:
          - all
          - submodule
          - skill

permissions:
  contents: read

concurrency:
  group: update-external
  cancel-in-progress: false

jobs:
  # --------------------------------------------------
  # submodule 参照の更新 (Fandhe-AI/actions/submodule-update)
  # --------------------------------------------------
  # 現時点で本リポジトリに .gitmodules は無いが、将来 submodule を
  # 追加した際にそのまま機能するよう team-hub と同一構成で用意する。
  submodule:
    name: Update submodule references
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "submodule"]'), inputs.target) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        # PAT 未設定時は GITHUB_TOKEN にフォールバック（auto-merge 後の CI 未発火に注意）。
        # base-branch が main 固定のため、workflow_dispatch を main 以外から実行しても
        # 常に main をチェックアウトして main 基準で更新を計算する。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}

      - name: Update submodules and open PR
        # Fandhe-AI/actions はタグ未作成のため最新コミット SHA に固定する。
        uses: Fandhe-AI/actions/submodule-update@c80ff94f229f86ba9e08723948c4dee0e1fb66bf
        with:
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}
          base-branch: main
          branch-prefix: chore/submodule-update
          commit-message: 'chore: submodule を最新に更新'
          pr-title: 'chore: submodule を最新に更新'
          pr-labels: 'dependencies,automated'
          # auto-merge の ON/OFF。未設定 (null/空) を有効と解釈する非対称設計のため、
          # 未設定時は明示的に 'false' へフォールバックしオプトイン運用とする。
          auto-merge: ${{ vars.SUBMODULE_AUTO_MERGE || 'false' }}
          auto-merge-allowlist: ${{ vars.SUBMODULE_AUTO_MERGE_ALLOWLIST }}
          auto-merge-strategy: squash

      - name: Warn when PAT is missing
        # secrets context は steps[*].if で参照できないため、env に写してシェル側で判定する。
        env:
          PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          [ -n "$PAT" ] && exit 0
          echo "::warning title=SUBMODULE_PAT 未設定::GITHUB_TOKEN で作成した PR は pull_request workflow を発火させず、" \
            "必須チェックが走らないため auto-merge が BLOCKED のまま停滞します。" \
            "fine-grained PAT (contents/pull-requests write) を SUBMODULE_PAT に設定してください。"

      - name: Close superseded update PRs
        # ブランチ名が {prefix}-{YYYYMMDD} で毎日新規作成されるため、マージされずに
        # 残った過去日付の PR は常に superseded。最新日付の 1 件だけ残して close する。
        # close は GITHUB_TOKEN で可能（後続 workflow の発火を必要としない）。
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}
          BRANCH_PREFIX: chore/submodule-update
        run: |
          set -euo pipefail
          newest=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq "[.[].headRefName | select(startswith(\"$BRANCH_PREFIX-\"))] | sort | last // empty")
          [ -z "$newest" ] && exit 0
          query=".[] | select(.headRefName | startswith(\"$BRANCH_PREFIX-\") and . != \"$newest\") | .number"
          msg="より新しい日次更新 PR (branch: $newest) が最新 main 基準で同内容を再生成しているため close します。"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName --jq "$query" |
          while read -r pr; do
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch --comment "$msg"
          done

  # --------------------------------------------------
  # Skills の更新 (Fandhe-AI/actions/skills-update)
  # --------------------------------------------------
  skills:
    name: Update agent skills
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "skill"]'), inputs.target) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        # PAT 未設定時は GITHUB_TOKEN にフォールバック（auto-merge 後の CI 未発火に注意）。
        # base-branch が main 固定のため、workflow_dispatch を main 以外から実行しても
        # 常に main をチェックアウトして main 基準で更新を計算する。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SKILLS_PAT || secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        # actions/setup-node v6.4.0。skills-update が使う npx skills のため node を固定する。
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - name: Update skills and open PR
        # Fandhe-AI/actions はタグ未作成のため最新コミット SHA に固定する。
        uses: Fandhe-AI/actions/skills-update@c80ff94f229f86ba9e08723948c4dee0e1fb66bf
        with:
          token: ${{ secrets.SKILLS_PAT || secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}
          base-branch: main
          branch-prefix: chore/skills-update
          commit-message: 'chore: エージェントスキルを最新に更新'
          pr-title: 'chore: エージェントスキルを最新に更新'
          pr-labels: 'dependencies,automated'
          # auto-merge の ON/OFF。未設定 (null/空) を有効と解釈する非対称設計のため、
          # 未設定時は明示的に 'false' へフォールバックしオプトイン運用とする。
          auto-merge: ${{ vars.SKILLS_AUTO_MERGE || 'false' }}
          auto-merge-allowlist: ${{ vars.SKILLS_AUTO_MERGE_ALLOWLIST }}
          auto-merge-strategy: squash

      - name: Warn when PAT is missing
        # secrets context は steps[*].if で参照できないため、env に写してシェル側で判定する。
        env:
          PAT: ${{ secrets.SKILLS_PAT || secrets.SUBMODULE_PAT }}
        run: |
          [ -n "$PAT" ] && exit 0
          echo "::warning title=SUBMODULE_PAT 未設定::GITHUB_TOKEN で作成した PR は pull_request workflow を発火させず、" \
            "必須チェックが走らないため auto-merge が BLOCKED のまま停滞します。" \
            "fine-grained PAT (contents/pull-requests write) を SUBMODULE_PAT に設定してください (org secret 共有)。"

      - name: Close superseded update PRs
        # ブランチ名が {prefix}-{YYYYMMDD} で毎日新規作成されるため、マージされずに
        # 残った過去日付の PR は常に superseded。最新日付の 1 件だけ残して close する。
        # close は GITHUB_TOKEN で可能（後続 workflow の発火を必要としない）。
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.SKILLS_PAT || secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}
          BRANCH_PREFIX: chore/skills-update
        run: |
          set -euo pipefail
          newest=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq "[.[].headRefName | select(startswith(\"$BRANCH_PREFIX-\"))] | sort | last // empty")
          [ -z "$newest" ] && exit 0
          query=".[] | select(.headRefName | startswith(\"$BRANCH_PREFIX-\") and . != \"$newest\") | .number"
          msg="より新しい日次更新 PR (branch: $newest) が最新 main 基準で同内容を再生成しているため close します。"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName --jq "$query" |
          while read -r pr; do
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch --comment "$msg"
          done

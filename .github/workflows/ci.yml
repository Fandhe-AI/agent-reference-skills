name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # スキル構造検証（依存なし・全 PR / push 共通）
  # --------------------------------------------------
  # 各 skills/<name>/SKILL.md の frontmatter (name / description / user-invocable)、
  # name とディレクトリ名の一致、skills-lock.json の JSON 妥当性を bash で検証する。
  structure:
    name: Skill structure check
    runs-on: ubuntu-latest
    # bash + grep のみの軽量ジョブ。hang 検知の保険として 5 分で打ち切る。
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Validate skill structure
        run: bash .github/scripts/check-skill-structure.sh

  # --------------------------------------------------
  # skill-tests（vendored スキルの node:test 回帰テスト）
  # --------------------------------------------------
  # .agents/skills/*/tests/*.test.mjs（vendored スキルの回帰テスト）を実行する。
  # skills/（リファレンススキル）はドキュメントのみでテスト対象外。
  # ubuntu-latest には Node.js が同梱されるため setup-node の追加
  # （新規 action の SHA 固定管理）は不要。
  skill-tests:
    name: Skill tests (node:test)
    runs-on: ubuntu-latest
    # 静的ファイル検査と gh スタブでの挙動テストのみのため軽量。structure job と
    # 同じ 5 分では implement-issue-tree の大規模テスト群が収まらないため 10 分とする。
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Run node:test
        # `shopt -s failglob` でグロブが 1 件もマッチしない場合にシェルを即エラー
        # 終了させる。failglob なしだとグロブが展開されずリテラル文字列のまま
        # node --test に渡り、0 tests・終了コード 0 で「成功」してしまう
        # （回帰テストゲートが無自覚に無効化される fail-open）。globstar で
        # tests/ 配下のサブディレクトリも再帰探索する（`**` は 0 階層にも
        # マッチするため tests/ 直下も引き続き対象。agent-cli-skills#447 の横展開）。
        run: |
          shopt -s globstar failglob
          node --test .agents/skills/*/tests/**/*.test.mjs

  # --------------------------------------------------
  # lint-docs（ドキュメント／設定ファイル系 lint）
  # --------------------------------------------------
  # npx 直呼びの個別実装から Fandhe-AI/actions の lint-docs reusable workflow
  # （SHA 固定・lint ツールバージョンは共通側で固定）へ置換した（イシュー #121）。
  # markdownlint の設定は `.markdownlint.jsonc`、除外は `.markdownlintignore` を
  # 参照する（緑のベースライン構成）。イシュー #126 で editorconfig / yamllint /
  # commitlint も有効化した（設定はそれぞれ `.editorconfig` / `.yamllint` /
  # `commitlint.config.mjs` を参照）。structure 等リポジトリ固有ジョブは現状維持。
  lint-docs:
    uses: Fandhe-AI/actions/.github/workflows/lint-docs.yml@latest
    permissions:
      contents: read
    with:
      # public リポジトリのため GitHub ホステッド runner を明示指定（組織 runner 方針）
      runner-label: ubuntu-latest
      markdownlint: true
      editorconfig: true
      yamllint: true
      # commitlint は PR の base/head から commit 範囲を取るため pull_request 専用
      # （reusable 側は他イベントを fail-closed で拒否する）。push でも動く本
      # workflow では event で切り替え、main への push では実行しない
      commitlint: ${{ github.event_name == 'pull_request' }}
